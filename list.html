<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/style.css">
<title>강동라이프</title>
</head>
<body data-page="list" class="has-map">
<div class="map-stage" id="map"></div>
<nav class="float-bar">
  <a class="glass-btn" href="./" aria-label="처음 화면으로"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
</nav>
<main class="sheet" id="sheet">
  <span class="grabber" aria-hidden="true"></span>
  <header class="sheet-head" id="head"></header>
  <label class="sr-only" for="q">가게 찾기</label>
  <input class="search" id="q" type="search" placeholder="가게 이름이나 동네로 찾기" autocomplete="off">
  <div class="chips" id="chips" role="group" aria-label="지역"></div>
  <div id="results"></div>
</main>
<script src="assets/map-data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
